# The column provenance site (docs/plans/Column_Provenance_Site_Plan.md). The pages are generated:
#   python -m simd_ingest.provenance_site && mkdocs build
site_name: Postcode-SIMD column provenance
site_url: https://mtinti.github.io/postcode-simd/
repo_url: https://github.com/mtinti/postcode-simd
docs_dir: build/provenance_docs
site_dir: build/provenance_site
strict: true
theme:
  name: material
  features:
    - navigation.instant
    - search.highlight
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
plugins:
  - search
nav:
  - Home: index.md
  - Columns: columns/index.md
  - Pinned sources: sources/index.md
  - Decisions: decisions/index.md
  - Checks: checks.md
not_in_nav: |
  /columns/*.md
  /sources/*.md
  /decisions/*.md
markdown_extensions:
  - tables
  - toc:
      permalink: true
