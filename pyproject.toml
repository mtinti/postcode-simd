[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "simd-ingest"
version = "6.0.0"
description = "Postcode-SIMD tables from the Scottish Statistics Postcode Lookup and Scottish Postcode Directory, built from hash-pinned sources with recorded lineage."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Michele Tinti" }]
# Pinned to the versions the release was verified with; this is an application, not a library.
dependencies = [
    "pandas==3.0.3",
    "numpy==2.4.6",
    "pyarrow==24.0.0",
    "PyYAML==6.0.3",
    "dbfread==2.0.7",
    "requests==2.32.4",
    "geopandas==1.1.4",
    "shapely==2.1.2",
    "pyogrio==0.13.0",
    "pyproj==3.8.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "duckdb==1.5.5"]
# The column provenance site and its description extractor; never needed by the build or the image.
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7", "python-docx==1.2.0", "openpyxl==3.1.5"]

[project.scripts]
simd-ingest = "simd_ingest.cli:main"

[tool.setuptools.packages.find]
include = ["simd_ingest*"]

[tool.setuptools.package-data]
simd_ingest = ["*.yaml", "*.csv"]

[tool.pytest.ini_options]
# Only the project's own tests: other folders in the checkout (a reviewer's suite, scratch work)
# must not be collected, or a bare `pytest` runs, and rewrites, someone else's files.
testpaths = ["tests"]
