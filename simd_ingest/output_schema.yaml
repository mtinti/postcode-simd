# Frozen output schema of the main table (Scottish Statistics Postcode Lookup, latest life per postcode).
# Order, Arrow type and nullability are the contract.
# 50 lookup columns + 6 derived + 6 PHS geography + 6 editions x 14 SIMD fields = 146, then the
# 41 Scottish Government domain ranks of postcode_simd_sspl_v3 appended, the 146 unchanged and in
# the same order: 6 domains for 2004, which had no crime domain, and 7 for each later edition = 187.
# postcode_simd_sspl_v4 appends the published domain bands, the 187 unchanged: quintile, decile and
# vigintile of each of the 41 domain ranks, then the 2020v2 housing source status = 311.
# postcode_simd_sspl_v5 appends the computed population-weighted Scotland quintile and decile of each
# domain rank, 82, then each edition's data-zone population, 6, the 311 unchanged = 399.
# Data zones follow the SSPL's allocation: the zone containing the 2022 output-area centroid.
version: postcode_simd_sspl_v5
