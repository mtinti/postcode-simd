# Pinned sources for the postcode-SIMD build. Version 2, 10 September 2026.
#
# Twenty-three remote objects supply fifty-six logical files. A remote object is what is
# downloaded; a logical file is what a builder reads. For a plain file they are the
# same bytes. For an archive, the declared members are extracted and each member's
# own hash is the pin. A pin is never updated by the pipeline: changed bytes stop it.
#
# Retired on 10 September 2026, with hashes kept in decisions.yaml as evidence: the two
# statistics.gov.scot extracts, the rank-to-band workbook and the 2020v2 ranks workbook.
# Every value they supplied is in the maps.gov.scot tables and was verified identical.
