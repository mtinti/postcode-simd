# PHS population-weighted SIMD, one CSV per edition, keyed by data zone.
# invert_bands: the 2004 and 2006 files publish bands with 1 = least deprived.
phs_editions:
  - key: '2004'
    file: PHS/simd2004_02042020.csv
    prefix: SIMD2004
    dz_vintage: 2001
    rows: 6505
    invert_bands: true
    geography_columns: [DataZone, IntZone, CA, HSCP, HB]
  - key: '2006'
    file: PHS/simd2006_02042020.csv
    prefix: SIMD2006
    dz_vintage: 2001
    rows: 6505
    invert_bands: true
    geography_columns: [DataZone, IntZone, CA, HSCP, HB]
  - key: '2009v2'
    file: PHS/simd2009v2_23062019.csv
    prefix: SIMD2009V2
    dz_vintage: 2001
    rows: 6505
    invert_bands: false
    geography_columns: [DataZone, IntZone, CA, HSCP, HB]
  - key: '2012'
    file: PHS/simd2012_02042020.csv
    prefix: SIMD2012
    dz_vintage: 2001
    rows: 6505
    invert_bands: false
    geography_columns: [DataZone, IntZone, CA, HSCP, HB]
  - key: '2016'
    file: PHS/simd2016_18052020.csv
    prefix: SIMD2016
    dz_vintage: 2011
    rows: 6976
    invert_bands: false
    geography_columns: [DataZone, IntZone, HB, HSCP, CA]
  - key: '2020v2'
    file: PHS/simd2020v2_22062020.csv
    prefix: SIMD2020V2
    dz_vintage: 2011
    rows: 6976
    invert_bands: false
    geography_columns: [DataZone, IntZone, HB, HSCP, CA]

# Scottish Government unweighted bands and population, one shapefile attribute table per
# edition. Column names differ between layers, so each edition declares its own map.
# The SIMD2009 layer holds the 2009v2 ranks; the SIMD2020 layer holds 2020v2.
govscot_editions:
  - {key: '2004',   file: data.gov.uk/SG_SIMD_2004/SG_SIMD_2004.dbf, dz_vintage: 2001, rows: 6505,
     columns: {datazone: datazone, rank: rank,   quintile: quintile,   decile: decile,   vigintile: vigintile,  population: totpop2001}}
  - {key: '2006',   file: data.gov.uk/SG_SIMD_2006/SG_SIMD_2006.dbf, dz_vintage: 2001, rows: 6505,
     columns: {datazone: datazone, rank: rank,   quintile: quintile,   decile: decile,   vigintile: vigintile,  population: sape2004}}
  - {key: '2009v2', file: data.gov.uk/SG_SIMD_2009/SG_SIMD_2009.dbf, dz_vintage: 2001, rows: 6505,
     columns: {datazone: datazone, rank: rank,   quintile: quintile,   decile: decile,   vigintile: vigintile,  population: sape2007}}
  - {key: '2012',   file: data.gov.uk/SG_SIMD_2012/SG_SIMD_2012.dbf, dz_vintage: 2001, rows: 6505,
     columns: {datazone: datazone, rank: rank,   quintile: quintile,   decile: decile,   vigintile: vigintile,  population: sape2010}}
  - {key: '2016',   file: data.gov.uk/SG_SIMD_2016/SG_SIMD_2016.dbf, dz_vintage: 2011, rows: 6976,
     columns: {datazone: datazone, rank: rank,   quintile: quintile,   decile: decile,   vigintile: vigintile,  population: sape2014}}
  - {key: '2020v2', file: data.gov.uk/SG_SIMD_2020/SG_SIMD_2020.dbf, dz_vintage: 2011, rows: 6976,
     columns: {datazone: datazone, rank: rankv2, quintile: quintilev2, decile: decilev2, vigintile: vigintilv2, population: sape2017}}

# The directory's own rank is an independent agreement check, not a join source.
directory_rank: {edition: '2020v2', column: ScottishIndexOfMultipleDeprivation2020Rank}

# Scottish Postcode Directory, cut edition. Counts are the published bulletin values.
spd_files:
  - {role: small_user, file: SPD/spd_postcodeindex_cut_26_2_csv/SmallUser.csv, rows: 196769, live: 157282}
  - {role: large_user, file: SPD/spd_postcodeindex_cut_26_2_csv/LargeUser.csv, rows: 51004,  live: 4767}
spd_published_totals: {all: 247773, live: 162049, deleted: 85724}

# Scottish Statistics Postcode Lookup: one combined file, latest life per whole postcode.
# NRS publishes no counts for it, so these are counted from the pinned file (decision
# sspl-totals-are-counted-not-published). They still gate: a changed file must change a pin.
sspl_file: {file: SSPL/sspl-2026-2/SingleRecord.csv, rows: 230103, live: 161822, small_user: 187490, large_user: 42613, totals_basis: counted}
