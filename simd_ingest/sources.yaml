# Urban Rural Classification versions, placed by point-in-polygon on each postcode life's own
# grid reference (docs/plans/Rurality_By_Version_Plan.md). Every version is eight multipolygons
# in British National Grid carrying the 6-fold and the 8-fold; the column names changed in 2016.
# reference_year is the first year in the version's name, not its publication date: the 2022
# version was published on 16 December 2024.
rurality_versions:
  - {key: '2003-2004', file: data.gov.uk/SG_UrbanRural_2003_2004/SG_UrbanRural_2003_2004.shp, reference_year: 2003, polygons: 8,
     columns: {sixfold: UR6FOLD, eightfold: UR8FOLD}}
  - {key: '2005-2006', file: data.gov.uk/SG_UrbanRural_2005_2006/SG_UrbanRural_2005_2006.shp, reference_year: 2005, polygons: 8,
     columns: {sixfold: UR6FOLD, eightfold: UR8FOLD}}
  - {key: '2007-2008', file: data.gov.uk/SG_UrbanRural_2007_2008/SG_UrbanRural_2007_2008.shp, reference_year: 2007, polygons: 8,
     columns: {sixfold: UR6FOLD, eightfold: UR8FOLD}}
  - {key: '2009-2010', file: data.gov.uk/SG_UrbanRural_2009_2010/SG_UrbanRural_2009_2010.shp, reference_year: 2009, polygons: 8,
     columns: {sixfold: UR6FOLD, eightfold: UR8FOLD}}
  - {key: '2011-2012', file: data.gov.uk/SG_UrbanRural_2011_2012/SG_UrbanRural_2011_2012.shp, reference_year: 2011, polygons: 8,
     columns: {sixfold: UR6FOLD, eightfold: UR8FOLD}}
  - {key: '2013-2014', file: data.gov.uk/SG_UrbanRural_2013_2014/SG_UrbanRural_2013_2014.shp, reference_year: 2013, polygons: 8,
     columns: {sixfold: UR6FOLD, eightfold: UR8FOLD}}
  - {key: '2016', file: data.gov.uk/SG_UrbanRural_2016/SG_UrbanRural_2016.shp, reference_year: 2016, polygons: 8,
     columns: {sixfold: UR6Class, eightfold: UR8Class}}
  - {key: '2020', file: data.gov.uk/SG_UrbanRural_2020/SG_UrbanRural_2020.shp, reference_year: 2020, polygons: 8,
     columns: {sixfold: UR6Class, eightfold: UR8Class}}
  - {key: '2022', file: data.gov.uk/SG_UrbanRural_2022/SG_UrbanRural_2022.shp, reference_year: 2022, polygons: 8,
     columns: {sixfold: UR6Class, eightfold: UR8Class}}

# The directory publishes one of these versions itself, which gives the placement a ground truth.
# Every build and every audit must reproduce it, before post-office boxes are withheld, or stop.
# The thresholds were fixed on 21 September 2026 before the first comparison was run: the share
# of lives whose derived 6-fold and 8-fold both equal the published codes, among current small
# users, and in every other cohort of more than min_cohort lives.
rurality_published: {version: '2022', sixfold: UrbanRural6Fold2022Code, eightfold: UrbanRural8Fold2022Code,
                     current_small_user: 0.995, other_cohorts: 0.99, min_cohort: 1000}

# The directory's own rank is an independent agreement check, not a join source.
directory_rank: {edition: '2020v2', column: ScottishIndexOfMultipleDeprivation2020Rank}

# Scottish Postcode Directory, cut edition. Counts are the published bulletin values.
spd_files:
  - {role: small_user, file: SPD/spd_postcodeindex_cut_26_2_csv/SmallUser.csv, rows: 196769, live: 157282}
  - {role: large_user, file: SPD/spd_postcodeindex_cut_26_2_csv/LargeUser.csv, rows: 51004,  live: 4767}
spd_published_totals: {all: 247773, live: 162049, deleted: 85724}

# Scottish Statistics Postcode Lookup: one combined file, latest life per whole postcode.
# NRS publishes no counts for it, so these are counted from the pinned file (decision
# sspl-totals-are-counted-not-published). They still gate: a changed file must change a pin.
sspl_file: {file: SSPL/sspl-2026-2/SingleRecord.csv, rows: 230103, live: 161822, small_user: 187490, large_user: 42613, totals_basis: counted}
