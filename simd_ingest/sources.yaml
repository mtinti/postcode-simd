# The SIMD2009 layer holds the 2009v2 ranks; the SIMD2020 layer holds 2020v2.
govscot_editions:
  - {key: '2004',   file: data.gov.uk/SG_SIMD_2004/SG_SIMD_2004.dbf, dz_vintage: 2001, rows: 6505,
     columns: {datazone: datazone, rank: rank,   quintile: quintile,   decile: decile,   vigintile: vigintile,  population: totpop2001}}
