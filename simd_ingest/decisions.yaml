# Decision log. Hashed into the table and copied into each build's retained run record.
# Superseded entries are history, not instructions for the current build.
version: 1
decisions:
  - id: bands-are-looked-up
    date: 2026-09-10
    status: implemented
    decision: Every band in the output is copied from a published file. No band is calculated from a rank.
    reason: The publisher's value is the auditable value. Earlier formula-based validation was later removed by trust-the-sources.
    evidence: SIMD_Plan_Gap_Closure.md section 2; halfup rule for 2001 zones and ceil rule for 2011 zones each reproduce the published bands with zero mismatches.

  - id: invert-2004-2006-phs-bands
    date: 2026-09-09
    status: implemented
    decision: The eight PHS population-weighted bands for SIMD 2004 and 2006 are re-derived as 11 - decile and 6 - quintile so that 1 means most deprived in every edition. Ranks and the Most15pc and Least15pc flags are never inverted.
    reason: PHS publishes those two editions with 1 = least deprived, the reverse of every later edition. The PHS deprivation guidance requires the reversal to be handled; handling it once upstream prevents every analyst handling it separately.
    evidence: PHS 2004 rank 1 has published country decile 10 and official government decile 1. Reversal is exactly invertible; raw files are pinned.

  - id: rank-direction-confirmed
    date: 2026-09-10
    status: implemented
    decision: Rank 1 is the most deprived data zone in all six editions.
    reason: The PHS rank is identical to the official Scottish Government rank on every zone in every edition, which contradicts the PHS documentation sentence about 2004 and 2006.
    evidence: SIMD_Plan_Gap_Closure.md section 4.

  - id: government-bands-from-shapefile-tables
    date: 2026-09-10
    status: implemented
    decision: The Scottish Government unweighted quintile, decile and vigintile come from the six maps.gov.scot shapefile attribute tables, joined on data zone, one route for every edition.
    reason: The tables carry every value the four earlier government pins supplied, plus population for every edition, from one publisher with one URL pattern.
    evidence: Bands identical to the statistics.gov.scot extracts on every zone for 2004 to 2016; 2020 bands identical to the rank-to-band workbook; 2020 population identical to the ranks workbook. The SIMD2009 layer's rank equals the PHS 2009v2 rank on all 6,505 zones.
    retired_pins:
      - {file: gov.scot/92eb1022-dd78-48a7-8ea6-08283b6c9adf.csv, sha256: 99dd8f8adaf5a35bb933f98bbe27867347413fdc0e60c74c8302700c2d17bc30}
      - {file: gov.scot/36465db2-8378-40e9-9bf8-fd016b0ee821.csv, sha256: 760636a8ff03b85bb8c4d6d589f43b52a8e15866acaab9123c17cd9486f44151}
      - {file: "gov.scot/SIMD+rank+to+quintile,+decile,+vigintile.xlsx", sha256: a1adaff2e2056bfd9d638d9850cdd296d972370bd704e20c73659553aaf18e24}
      - {file: gov.scot/SIMD+2020v2+-+ranks.xlsx, sha256: 9904aa957a8177853564415e848e08553c17491d1578ff631a5074cacc9fb296}

  - id: percentile-omitted
    date: 2026-09-10
    status: implemented
    decision: No percentile column in any edition.
    reason: No source publishes a stable percentile for 2001 data zones. The shapefile tables carry one, but it follows neither band rule and differs between editions. Filling two editions and leaving four null would invite misuse.
    evidence: SIMD_Source_API_Options.md.

  - id: record-key
    date: 2026-09-10
    status: implemented
    decision: The primary key is normalised postcode plus introduction date. Deletion date, user type and release are attributes.
    reason: Unique across all 247,773 records in SPD 2026/2. Postcode alone repeats up to seven times.
    evidence: SIMD_Plan_Gap_Closure.md section 6. Validated on every release; never silently deduplicated.

  - id: postcode-normalisation
    date: 2026-09-09
    status: implemented
    decision: pc_norm is the postcode uppercased with ASCII spaces removed, keeping any NRS split suffix. pc_base removes a validated A, B or C suffix only from a small-user record flagged as split. A large-user split flag never shortens its own postcode.
    reason: The suffix attaches to bases of five to seven characters, so length alone cannot identify it. A large-user split flag describes its linked small-user postcode.
    evidence: 458 current small-user split records, all ending in A, B or C; 226 ordinary postcodes with more than one current candidate.

  - id: half-open-intervals
    date: 2026-09-10
    status: implemented
    decision: A record is valid for introduced_on <= date < deleted_on, with null deletion open-ended. Same-day records are retained but never match an as-of query.
    reason: Eight small-user records reuse 18 February 2026 as both a deletion and a reintroduction date, so a closed-interval rule would report overlaps that are not there.
    evidence: SPD 2026/2 news bulletin, retrospective split correction for AB31 5AS, AB54 7NS, FK14 7JX and KA6 6EY.

  - id: link-sentinels
    date: 2026-09-10
    status: implemented
    decision: NO LINKP and NO LINK in the large-user linked-postcode field are kept as text and both classified as no link. Ingestion attaches SIMD through each record's own data zone, not through this field. Default SSPL SQL preserves those values with address warnings; only legacy SPD SQL follows links. See sspl-direct-sql-both-publishers.
    reason: NO LINKP is documented for PO boxes. NO LINK is undocumented and appears on six deleted records.
    evidence: 31,725 NO LINKP, 6 NO LINK, 19,273 real links, all resolving.

  - id: spd-cut-edition
    date: 2026-09-10
    status: implemented
    decision: The cut edition of the postcode index is accepted. Three Royal Mail count fields present in the full edition are absent.
    reason: The cut edition is the freely available one and carries every geography field the build needs.
    evidence: spd-indexdatadictionary-2026-2.docx.

  - id: large-user-geography-attached
    date: 2026-09-10
    status: implemented
    decision: SIMD is attached to every large-user record, including PO boxes, because the directory assigns them a data zone. This is ingestion source fidelity, not a claim about residence eligibility. Default SSPL SQL preserves own-record values and flags address concerns; legacy SPD SQL follows links. Python keeps its own-record geography and sentinel exclusion. See sspl-direct-sql-both-publishers.
    reason: Source fidelity. The build attaches what the directory says; it does not decide which postcodes deserve a value.
    evidence: PHS deprivation guidance v3.5, Appendix A.

  - id: band-column-names-state-weighting
    date: 2026-09-10
    status: implemented
    decision: PHS population-weighted bands are named simd{ed}_pw_*; Scottish Government unweighted bands are simd{ed}_uw_*.
    reason: The PHS guidance says the two must never be mixed in one analysis and must always be identified. A column name is the label an analyst cannot lose.
    evidence: PHS deprivation guidance v3.5, section 3.1.1 and checklist.

  - id: phs-geography-columns
    date: 2026-09-10
    status: implemented
    decision: Six columns carry the health board, HSCP and council area code PHS assigned to each data zone, one set per data-zone vintage.
    reason: The within-geography bands are only valid against the geography PHS computed them in, which differs from the directory's 2019 code on a few records.
    evidence: 8 records differ for 2011 zones; 35 (HB) and 86 (HSCP, CA) for 2001 zones. PHS codes are identical across editions of the same vintage.

  - id: reconstruction-is-diagnostic
    date: 2026-09-10
    status: superseded   # by trust-the-sources, 11 September 2026
    decision: Reconstructing the PHS population-weighted bands from ranks and population is a diagnostic that never blocks a build and never replaces a published value.
    reason: The ingestion guarantee is source fidelity, not reproduction of the publisher's method.
    evidence: The midpoint rule reproduces every Scotland-level decile and quintile in all six editions; three 15% flag cells and two Shetland sub-geography zones differ. Expected exceptions are pinned in acceptance_baselines.yaml.

  - id: glossary-is-documentation
    date: 2026-09-10
    status: implemented
    decision: The 2020 shapefile glossary and the two NRS guides are pinned as documentation. No table reads from them.
    reason: They are the official definitions of the field names the column maps rely on, and they arrive inside archives that are downloaded anyway.

  - id: single-combined-output
    date: 2026-09-10
    status: implemented
    decision: One Parquet file holds both user types; a future release replaces it entirely.
    reason: One import path for consumers. Records absent from a new release must not linger.

  - id: patient-linkage-deferred
    date: 2026-09-10
    status: superseded   # consumer helpers implemented; see split-resolution-a-part
    decision: The downstream resolver for ambiguous split postcodes, with its unique, split_consensus, split_conflict, incomplete and not_found statuses, is recorded in the plan and not implemented here.
    reason: It belongs to the consumer of this table, not to its ingestion.

  - id: asset-naming
    date: 2026-09-10
    status: implemented
    decision: The two reference tables are named phs_bands and govscot_bands. The joined output is postcode_simd and the directory table is postcode_index.
    reason: The pair of names states the one thing an analyst must not confuse, which publisher's weighting a band carries. Grain-based names distinguished nothing, since both tables are keyed by edition and data zone.
    evidence: Step 2 review, 10 September 2026. Renamed before the first release so the instance record starts with the final keys.

  - id: instance-location
    date: 2026-09-10
    status: superseded   # CLI-first retains run records beside results instead
    decision: The Dagster instance, which is the provenance record, lives at .dagster inside the project and is backed up together with results/. Intermediate tables are kept outside it under data/work.
    reason: A record in a temporary path is not a record. Whether HIC wants it on a shared, backed-up path instead is an operational decision still to be taken; it is one environment variable either way.

  - id: lookup-statuses
    date: 2026-09-11
    status: superseded   # by split-resolution-a-part, same day
    decision: simd_ingest.lookup resolves a postcode to one of five statuses, unique, split_consensus, split_conflict, deleted or not_found. Several valid records agree on the requested measure gives consensus with the value; disagreement gives conflict with a null value. A full NRS key selects its own split part. Never choose A, average or vote.
    reason: The policy already agreed in the plan, made executable. Ambiguity is reported, not hidden.
    evidence: On the 226 current ordinary postcodes with more than one record, rank gives 203 conflicts and 23 consensus; docs/EXAMPLES.md.

  - id: recommended-edition-is-explicit
    date: 2026-09-11
    status: implemented
    decision: lookup.recommended_edition implements the PHS guidance's table 4, years of health data to edition. Nothing calls it implicitly; the analyst passes an edition to every lookup.
    reason: Which edition to use is the analyst's decision under the guidance. The helper makes the recommendation easy to follow and impossible to follow by accident.

  - id: docker-image
    date: 2026-09-11
    status: implemented
    decision: The pipeline ships as a Docker image built on python:3.12-slim pinned by digest, with no data, results or instance baked in; those are mounted from the host.
    reason: A clean-machine reproduction on demand, and one artefact HIC can run without assembling a Python environment. Where the image is published is still to be decided.

  - id: linkage-by-era
    date: 2026-09-11
    status: superseded   # SQL replaced by sql-latest-linked-postcodes; Python remains historical
    decision: Linking events to SIMD by era follows the guidance's table 4, each event taking the edition recommended for its year and the record valid on its date. Events before 1996 get status no_edition with every SIMD column null, including the matched key. The Python and SQL implementations are tested to agree row for row on a synthetic cohort.
    reason: "One rule, two implementations that cannot drift. Withholding the key on no_edition keeps the output columns consistent: no edition, no answer."
    evidence: tests/test_lookup.py ByEraPythonAndSqlAgree; docs/sql/link_by_era.sql; docs/LINKAGE_BY_ERA.md.

  - id: lookups-exclude-po-boxes
    date: 2026-09-11
    status: superseded   # SQL now has explicit failure statuses, no include switch; Python unchanged
    decision: "Every lookup, in Python and in the SQL, excludes large-user records whose link field is NO LINKP or NO LINK by default. Both offer a switch to include them, and a second switch to exclude all large-user records. The table itself keeps every record with the SIMD the directory assigns."
    reason: "The PHS guidance, Appendix A, attaches no deprivation to PO boxes because their location is a sorting office. An analyst reading the guidance expects the default to match it; the table stays source-faithful because the exclusion is applied at lookup time, not at build time."
    evidence: "1,518 current PO box records among 4,767 current large-user records."



  - id: split-resolution-a-part
    date: 2026-09-11
    status: superseded   # SQL now has one A-only policy; Python retains its report alternative
    decision: "When several split parts of a postcode are valid, every lookup resolves to the A part by default and reports status a_part. A split=\"report\" rule returns split_consensus or split_conflict instead. The result's label records which rule was used. Python and SQL are tested to agree under both."
    reason: "NRS builds the Scottish Statistics Postcode Lookup by converting split postcodes to the A part, because A is the part with more addresses, so every official statistic uses that convention. Matching it by default means an analyst reconciling against official figures gets the same answer; the report rule keeps the ambiguity visible for anyone who wants it. Supersedes the never-choose-A rule of lookup-statuses."
    evidence: "NRS Scottish Statistics Postcode Lookup information note; SPD 2026/2 bulletin on suffix ordering; docs/NRS_GUIDANCE_CHECK.md. On the synthetic cohort, 56 events resolve as a_part."

  - id: visible-steps-and-build-report
    date: 2026-09-11
    status: superseded   # visible code/report retained; orchestration removed by cli-first
    decision: "The build is written as small named steps in code: one function per directory file, per PHS file as published, per canonicalised PHS edition, per government edition, and one join per edition, each with its own checks. The Dagster graph stays at five things, sources plus four tables, and the steps appear as rows in a build report, results/BUILD_REPORT.md, written by every build in plain language with that run's numbers. docs/HOW_IT_IS_BUILT.md is the static one-page companion."
    reason: "A first attempt exposed every step as a graph node, fifty-one in all, and a reviewer could not read it. A graph is a machine's view; a reviewer needs a narrative with numbers. The steps stay visible where they help, in the code and the report, and out of the graph where they do not."
    evidence: "CLI and Dagster builds on branch ladder both produced sha256 c685cd137652ec37 under main's decision log, byte-identical to main. Twenty-two assets, twenty-four checks, intermediates about 16 MB of Parquet."

  - id: trust-the-sources
    date: 2026-09-11
    status: implemented
    decision: "No SIMD value is recomputed or compared between publishers. The population reconstruction diagnostic, the band-formula checks and the PHS-versus-government divergence fingerprints are removed. The one remaining cross-source check is that PHS and the Scottish Government list the same data zones with the same ranks in every edition."
    reason: "The pipeline's guarantee is that the published values reach the table unchanged, which the hash pins, the per-step checks and the readback establish. Recomputing bands to see whether the publisher's method can be reproduced answered a different question and made the build harder to read. The rank check stays because it is what justifies joining the two sources on the data zone."
    evidence: "Removing these checks changes no value; the output remains byte-identical."

  - id: cli-first
    date: 2026-09-12
    status: implemented
    decision: "The CLI is the only build path. Remove the Dagster runtime, web server, asset wrappers, instance configuration and persisted intermediates. Keep one visible verify/prepare/cross-check/join/readback/publish sequence, a human build report and small retained run records."
    reason: "Routine maintenance is a postcode-directory refresh; SIMD editions arrive less frequently. A full deterministic rebuild from pinned sources is cheap. Source/configuration snapshots, runtime/code hashes and saved-file checks provide lineage without a second execution model."
    evidence: "tests/test_pipeline.py tests postcode refresh, full replacement, failure evidence, read-only audit and a synthetic seventh edition on a new data-zone vintage."

  - id: release-facts-not-fixed-gates
    date: 2026-09-12
    status: implemented
    decision: "Published file/all/live/deleted counts remain blocking inputs in sources.yaml. Header contracts remain explicit. Split/repeated-key/key-length/touching-date/link-category/ambiguity profiles are recorded observations, not fixed 2026/2 acceptance constants. Compare each new snapshot with the previous hash-verified snapshot by natural key, excluding the release label from record changes."
    reason: "Normal release changes should be visible to a reviewer without requiring changes to pipeline code or weakening correctness checks. An unavailable comparison is reported explicitly and does not block a source-faithful build."

  - id: edition-extension
    date: 2026-09-12
    status: implemented
    decision: "PHS header order, data-zone vintage, band direction and Government column maps are declared per edition. Both publishers must declare the same edition keys, vintage and zone count. Add explicit output fields for each new edition, and PHS geography fields for new vintages; shared-vintage geography must agree. Analyst edition-by-year recommendations are reviewed separately."
    reason: "New editions using the supported CSV/DBF layout need registry and schema changes, not a new build path. Unknown formats or incomplete historical geography coverage require deliberate review."

  - id: simple-publication
    date: 2026-09-12
    status: implemented
    decision: "Use one writer per results directory. Validate the saved candidate and prepare evidence before individually replacing the current table and sidecars. Keep run records, not old Parquet copies. No restart/concurrency state machine: after interruption, audit and rebuild if needed. Audit never downloads or repairs sources."
    reason: "Atomic replacement protects the table from validation failures. It is not a transaction across the table and sidecars; their hash agreement must be checked before import."

  - id: sql-latest-linked-postcodes
    date: 2026-09-12
    status: superseded   # SPD behaviour retained; SSPL default added by sspl-migration-review
    decision: "Two SQL examples share one latest-postcode view. One uses a chosen SIMD edition (default 2020v2); one uses PHS v3.5 Table 4 by event year. Both use PHS population-weighted Scotland quintiles, 1 most deprived. The date selects the edition, not a historical postcode life. Ordinary split postcodes use A; large users use the latest record of the exact named small-user link, including an explicit split suffix. Missing/unusable links have null SIMD, never an own-geography fallback. Keep every event row and expose both matched and source natural keys."
    reason: "The user chose the linked-small-user route. Keep edition choice separate from postcode selection and put shared rules in one reviewable place. PHS's postcode page describes latest versions and A parts; Appendix A describes large-user links but does not fully specify own-versus-linked disagreement. Exact equivalence to a published PHS postcode lookup remains unverified."
    evidence: "docs/LINKAGE_BY_ERA.md maps code to guidance and labels project choices; tests/test_sql.py uses explicit fixtures and downloaded-data checks. SPD 2026/2 example AB11 6GN has own 2020v2 quintile 2 but linked AB11 6BE supplies 3."

  - id: sql-representative-and-interface-boundary
    date: 2026-09-12
    status: implemented   # the SPD representative rule continues as steps 4-5 of the SPD set; see sql-two-products-no-default
    decision: "For the SPD SQL setup and the cross-table comparison, select the newest life per full key across both user types, then prefer live records, whole/A, and newest introduction per ordinary postcode. Ties and missing A receive no geography. Retain last-known deleted records, including named small-user link targets, with current flags. Missing dates and years without an edition have distinct statuses. Accept ordinary input postcodes only. SSPL already selects latest whole records upstream. Python keeps its separate current/as-of, own-record geography policy; no Python/SQL parity is claimed."
    reason: "This ordering and complete deleted-record retention are explicit project policies, not a claim to reproduce PHS's unpublished selection details. Do not silently change existing Python consumers or revive an older small-user record when the newest life is an unlinked large user. New SIMD editions and year mappings require separate review."

  - id: sspl-main-table
    date: 2026-09-12
    status: implemented
    decision: "Two tables from two NRS products. The main table, postcode_simd.parquet, is built from the Scottish Statistics Postcode Lookup (SSPL): one row per whole postcode, both user types, latest life including deleted postcodes, key pc_norm. The history table, postcode_simd_history.parquet, is the existing SPD build: every postcode life, key (pc_norm, introduced_on), rows unchanged. Neither table is derived from the other."
    reason: "NRS recommends SSPL for statistical production. History is still needed for date-valid postcode matching and inspecting split parts. Choosing an SIMD edition by event year does not itself require postcode history: the default SQL era query reads SSPL."
    evidence: "docs/plans/SSPL_Main_Table_Plan.md section 1: SSPL 2026/1 has 229,708 unique whole postcodes, both data-zone vintages, no blank geography, PO-box sentinels, and deletion dates."

  - id: sspl-allocation-is-part-of-the-contract
    date: 2026-09-12
    status: implemented
    decision: "The main table's data zones are the SSPL's: every higher geography is the one containing the centroid of the postcode's 2022 output area. The history table's data zones are the SPD's: the zone containing the postcode's own grid reference. Each table's metadata names its method (allocation: oa2022_centroid or postcode_grid_reference), the data dictionary states it, and every build reports how many current postcodes differ between the two tables and how many SIMD bands change as a result. The difference is an observation, never a gate, and never reconciled by editing either table."
    reason: "A user must be able to see which allocation method a table follows. The comparison reports observed differences, not a causal decomposition into release and allocation effects. It compares own-record bands before linked-small-user selection. Neither shared inputs nor matching bands establish equivalence to a PHS postcode-level lookup."
    evidence: "NRS information note and current build report. The preliminary SSPL 2026/1 comparison in the historical plan used different PAF cuts and incorrect representatives for 19 postcodes; its provisional counts and cause claims are not acceptance evidence."

  - id: which-table-answers-which-question
    date: 2026-09-12
    status: implemented   # its "default SQL" clause is superseded by sql-two-products-no-default; the Python refusals stand
    decision: "Python date-valid lookups (on=, attach with a date column, attach_by_era) and split-report requests need SPD history and are refused against SSPL. Default SQL uses own-record SSPL geography and an analysis year to select the edition, returning both publishers and address warnings. Legacy SPD SQL is isolated under docs/sql/history. Python remains current-only/as-of with own-record geography and sentinel exclusion. Both stored tables retain source values for PO boxes and unlinked large users; consumers apply their documented exclusions."
    reason: "One latest life per postcode cannot say whether a postcode existed at a date or which zone it was in then. Making the refusal explicit prevents a silent wrong answer. The split and PO-box defaults are unchanged so existing consumers see the same policy."
    evidence: "SSPL dictionary: no small-user split postcodes; A part used; counts added. SSPL 2026/1 links: NO LINKP on 27,162 large users, NO LINK on 5, 15,368 real links of which 9 keep an A suffix."

  - id: sspl-totals-are-counted-not-published
    date: 2026-09-12
    status: implemented
    decision: "NRS publishes no record counts for the SSPL. The registry pins the counted totals of the pinned file (all, live, small user, large user) and marks them counted. They are blocking gates like the SPD's published totals, because they detect a changed or truncated file, but they are not independent evidence from the publisher."
    reason: "The pipeline's rule is that a count gate is an input a reviewer can check against something outside the build. For the SSPL the only external check is the file hash, so the totals must be labelled for what they are."
    evidence: "SSPL 2026/1 bulletin and data dictionary carry no totals. Counted: 229,708 all; 161,565 live; 187,173 small user; 42,535 large user."

  - id: two-nrs-cuts
    date: 2026-09-12
    status: implemented
    decision: "The SSPL and the SPD pinned together need not be the same PAF cut; each table records its own release label. Cross-table differences in postcode presence, introduction date, live status and user type are reported as observations. A pin is chosen by hand for each product."
    reason: "The products may be refreshed independently, but there is no need to retain an older SSPL when the intended newer release is available. The current pins are both 2026/2. Matching release labels still do not establish the cause of each geography difference."
    evidence: "SSPL 2026/2 publication, 18 August 2026, July PAF: https://www.nrscotland.gov.uk/publications/scottish-statistics-postcode-lookup-20262/. The older SSPL 2026/1 pin was superseded by sspl-migration-review."

  - id: version-2
    date: 2026-09-12
    status: implemented
    decision: "The change ships as 2.0.0. The main table's file keeps its name but its key and row grain change, and the previous table moves to postcode_simd_history.parquet."
    reason: "A consumer reading postcode_simd.parquet will get one row per postcode instead of one per life. That is a breaking change and the version must say so."

  - id: sspl-migration-review
    date: 2026-09-13
    status: superseded   # source/schema fixes retained; SQL policy replaced below
    decision: "Version 2.0.1 reconciles the migration. Pin SSPL 2026/2 (230103 rows, 161822 live, 187490 small users, 42613 large users); update the two Scottish Parliament columns to 2026 and main schema to postcode_simd_sspl_v2. Default SQL reads main; create_latest_postcode_lookup_history.sql is the explicit SPD alternative. Both share the two edition queries and return index_source, index_release, allocation and requested_link_postcode. SSPL accepts a linked A suffix only for a flagged small-user split representative; B/C cannot resolve. Never fall back across products. Correct the comparison selection and remove unsupported causal/PHS-parity claims."
    reason: "The implementation, decision log and examples must agree. Preserve the SPD history fingerprint independently of an SSPL refresh, and check the new main fingerprint only against its own reviewed source pins and schema. Keep historical plans clearly superseded."
    evidence: "tests/test_agreement.py checks synthetic and real SQL parity; tests/test_sql_sspl.py covers SSPL-only links, exclusions, era boundaries and row preservation; build/audit read back both saved tables against pinned sources. Original SSPL 2026/1 archive hash b8bc805567a167dd23a8891dddf44855a8174ddff3885c7f3caa0defc8d83478 and row fingerprint 6c14f4596b3fabb2c814d0af945eae02e00ea330f7440791437990ef4d98aa0f are retained as historical evidence."

  - id: sspl-direct-sql-both-publishers
    date: 2026-09-13
    status: superseded   # by sql-two-products-no-default: no default set, and the SSPL set follows large-user links
    decision: "Default SQL takes postcode and integer analysis year. Use the exact matched SSPL record's geography, never redirect large users or resolve splits again. Map the year to SIMD using PHS v3.5 Table 4 and return all 14 ingested PHS/Government measures, distinctly labelled, with the selected data-zone vintage and PHS local-band geography codes. Keep every input row and report postcode/year/missing-value statuses independently of address warnings. PO boxes, unlinked large users and deleted records retain source values; residence eligibility and publication choices are downstream. Preserve the earlier SPD linked-small-user examples under docs/sql/history, not as a default fallback."
    reason: "The user chose SSPL's published allocation and requested both publishers so later analysis can choose measures. Re-following links overrides that allocation: in SSPL 2026/2 it changed 147 PHS 2020v2 quintiles, including 50 live postcodes. NRS supplies postcode geography; PHS supplies the health-year edition policy and population-weighted bands. This is not a claim of exact PHS postcode-lookup equivalence or a pre-filtered residential cohort."
    evidence: "NRS SSPL information note; PHS v3.5 sections 3.1-3.4, Table 4 and Appendix A. tests/test_sql_sspl.py checks every reshaped value and PHS geography across the saved editions, all year boundaries, duplicate/unmatched events, and unchanged large-user own values. AB24 2TY retains quintile 5, rather than linked AB24 2TN's quintile 1. SQL Server runtime verification remains separate."

  - id: sql-two-products-no-default
    date: 2026-09-13
    status: implemented
    decision: >-
      Two SQL sets, docs/sql/spd reading postcode_simd_history (key pc_norm, introduced_on)
      and docs/sql/sspl reading postcode_simd (key pc_norm), with no default or cross-product
      fallback. Each has standalone link_by_era.sql (id, postcode, analysis_year; edition by
      PHS v3.5 Table 4) and link_latest.sql (id, postcode; one edition throughout), with
      numbered steps distinguishing guidance from project choices. They share a 41-column
      core through band_direction, then append different own-record context: SSPL has 91
      columns, SPD era/latest 107. Select common columns by name when combining results.
      The SPD set selects the latest life per full NRS key, then prefers live, whole or A,
      newest introduction; a best B/C-only record gets split_a_missing, a tie gets
      ambiguous_postcode, both without SIMD. SSPL needs neither selection step. Both follow
      LinkedSmallUserPostcode to a small-user record: SPD uses the exact suffix; SSPL accepts
      an A alias only for a whole record flagged SplitIndicator Y, and cannot resolve B/C.
      NO LINKP gets po_box, NO LINK/blank/null gets unlinked_large_user, without SIMD.
      The source record supplies all 14 stored measures and selected-vintage geographies;
      the matched record's own fields remain context. No chaining through large users.
    reason: >-
      Product and edition policy remain explicit study choices, but NRS recommends SSPL
      for statistical production and SPD for operational/administrative use. Applying
      linked-small-user geography to SSPL is a project interpretation of PHS Appendix A,
      which describes links and absent geography for PO boxes/unlinked large users but
      does not explicitly settle overriding geography already allocated in SSPL. Absence
      of contrary NRS guidance is not endorsement. Preserve the chosen policy pending
      authoritative confirmation or comparison with a PHS postcode-level oracle; retaining
      own-record context makes its effect visible. The SSPL suffix rule is also a project
      interpretation. Exact PHS lookup parity remains unverified.
    evidence: "PHS v3.5 Appendix A pp.28-30, Table 4 p.17, sections 3.1-3.4; PHS postcode-file page (most recent version, A part only); NRS SSPL information note and 2026/2 dictionary; NRS SPD 2026/2 dictionary on PO-box grid references. Worked example AB24 2TY: own 2020v2 quintile 5, linked AB24 2TN quintile 1, identical in both tables. Plan: docs/plans/SQL_Two_Products_Plan.md."

  - id: sql-as-of-address-date
    date: 2026-09-13
    status: implemented
    decision: >-
      The SPD set adds link_as_of.sql with input id, postcode, address_date, analysis_year.
      As a project policy, select lives in [introduced_on, deleted_on), apply the whole/A
      preference among valid lives, follow a large user's exact link to the small-user life
      valid on that date, and choose the edition from analysis_year. Report
      postcode_not_yet_introduced, between_lives or postcode_deleted_by_date when no life
      contains the date, and missing_address_date for a known key with no date. Return
      first_introduced_on, previous_life_deleted_on and next_life_introduced_on as context.
      The 41-column core is shared with the other queries, but the added dates make 110
      total columns. SSPL has no dated query because NRS kept one life per postcode.
    reason: >-
      Latest-life matching can assign a re-used postcode's new location to an older address:
      2,957 reviewed SPD postcodes have a latest life in a different 2011 zone from the life
      before, 2,030 with a different 2020v2 quintile. A reliable address date can distinguish
      these lives; a general CHI record edit timestamp must not be assumed to describe
      residence without checking its meaning. Keep address date separate from the health
      data year. This policy does not reconstruct historical administrative or rurality
      snapshots; context remains what the downloaded release supplies for the selected life.
    evidence: "FK17 8DS: 1975 resolves to the 1973 life in S01013116 (quintile 5), 1990 to the 1978 life in S01013113 (quintile 3), June 1978 falls between the lives. TD9 7PQ: matched on 15 May 1990 with matched_is_current false, deleted by date on its deletion day, not yet introduced in 1970. tests/test_sql_sets.py covers the interval boundaries, the gap, the split and link rules on a date, and every recorded life on its own introduction day against the built table."

  - id: sql-review-corrections
    date: 2026-09-13
    status: implemented
    decision: >-
      Correct SQL Server bit predicates to is_current = 1. Resolve dated lookups per distinct
      normalised postcode/address-date pair and join back to original inputs, without an
      execution-dependent row number; preserve duplicates and null IDs. Test output mappings
      independently of the generator, including a deliberately swapped quintile/decile
      regression, every stored edition, selected geographies and own-record context.
      Clarify the preceding decisions' output contracts and guidance claims without changing
      postcode linkage policy, source pins or stored data values.
    reason: >-
      SQL Server requires a predicate for bit fields and does not materialise CTEs; unordered
      ROW_NUMBER values are not stable join keys across references. A shared production/test
      mapping can hide column swaps. Reviewers must distinguish documented guidance,
      project interpretations and native runtime verification that remains outstanding.
    evidence: >-
      Microsoft Learn: bit (Transact-SQL), CASE (Transact-SQL), WITH common_table_expression
      (Transact-SQL), ROW_NUMBER (Transact-SQL). tests/test_sql_sets.py exercises generated
      queries in DuckDB; these checks do not establish SQL Server runtime compatibility.

  - id: shared-exports
    date: 2026-09-16
    status: implemented
    decision: >-
      Every build writes a gzipped CSV of each table beside the Parquet, and one contract,
      simd_ingest/export_contract.yaml, governs both it and the SQL examples. The contract
      withholds GridReferenceEasting and GridReferenceNorthing from both tables and Latitude
      and Longitude from the history table, so neither the CSV nor a linkage result carries a
      coordinate; the Parquet keeps every column and its schemas are unchanged. CSV is comma
      separated with RFC 4180 quoting, UTF-8 without a byte order mark, LF endings and gzip
      written with no name or timestamp, so the same rows give the same bytes. Dates are
      YYYY-MM-DD, is_current is 1 or 0, and all other values are written exactly as stored.
      A null and a source blank are the same empty cell, resolved by table, column and record
      type, which the dictionaries state and the contract records. The build also records a
      row digest per table, computed from the accepted table rather than from a re-read of the
      file, so a database load can be checked after import. Each CSV is read back cell for cell
      before publication; results/CSV_README.txt carries every publisher's attribution; the
      manifest is written last and records every hash; audit recomputes them.
    reason: >-
      The CSV is how the table is shown to the team, so it is the copy most likely to leave the
      building and the one that should carry the least. Withholding coordinates is a project
      data-minimisation choice first: a linkage result is one row per patient, and a grid
      reference is a precise location where a data zone is not. It is also conservative about
      licensing, since NRS restricts "postcode boundaries and grid references" separately from
      its openly licensed index and lookups but does not say which governs a coordinate column
      inside an index file. That reading is unconfirmed and is on the list of questions for
      Research Data Scotland. Excluding the columns from the SQL as well keeps one policy
      rather than a footgun for anyone who imports the CSV under the table name the queries use.
    evidence: >-
      tests/test_exports.py states the renderings independently of the writer and covers the
      empty-cell rules, leading zeros, quoting, non-ASCII and supplementary characters,
      determinism, structural damage and the corruptions a load introduces. Reserved framing
      characters are rejected in source text rather than stripped. On SPD 2026/2 and SSPL
      2026/2 the CSVs are 8.3 MB and 7.2 MB gzipped, and both rows-only fingerprints are
      unchanged; the Parquet file hashes change because this entry changes the decision log.

  - id: database-load-check
    date: 2026-09-16
    status: implemented
    decision: >-
      Two more generated scripts ship beside the lookups, both produced by
      python -m simd_ingest.sql_check from the output schemas and the export contract.
      docs/sql/import_csv.sql stages each shared CSV as text and restores the declared types,
      putting an empty cell back as a blank or a null according to the contract's rules.
      docs/sql/check_loaded_digest.sql then verifies the declared columns, types, nullability
      and order, the natural key, the absence of the characters the digest frames with, the row
      count and the row digest the build recorded. Expected values come from the manifest, never
      from the loaded table. The scripts read; they never repair, replace or promote anything,
      and the CLI never connects to a database.
    reason: >-
      A file hash proves the CSV arrived intact, not that the load preserved it, and the two
      failures that matter are silent: a reader gives every empty field as NULL whatever it
      meant, and an empty string becomes 1900-01-01 as a datetime. The digest is computed from
      the accepted table rather than from a re-read of the file, so an import mistake cannot
      appear on both sides of the comparison. It is compact and probabilistic: each SHA-256 is
      truncated to eight bytes and the signed prefixes are summed, so collisions and cancelling
      changes are possible. It detects accidental corruption and is neither an exact cell
      comparison nor a signature. Structure and key checks sit beside it because a digest is
      order independent and blind to types.
    evidence: >-
      Verified on SQL Server 2022 Developer Edition 16.0.4252.3 in the project's container.
      Both tables imported by the shipped recipe, 230,103 and 247,773 rows, and all ten checks
      passed with the digests equal to the manifest's. Eight deliberate corruptions were each
      caught and undone: a lost leading zero, a blank turned into a null and the reverse, an
      empty deletion date turned into 1900-01-01, truncated text, a changed band away from any
      documented example, a deleted row, and a column altered to accept null. The five lookup
      queries ran there unchanged and gave their documented answers, which retires the
      "SQL Server syntax intended but not verified" caveat for that version only. Findings
      recorded in the recipe: CODEPAGE is rejected on Linux, so the encoding is declared as a
      UTF-8 collation on the staging columns; HASHBYTES over an nvarchar expression hashes
      UTF-16, so the text is converted to varchar with a binary UTF-8 collation first; and
      CONCAT_WS drops a NULL argument, so every column is wrapped before framing.

  - id: sql-as-of-year-from-address-date
    date: 2026-09-18
    status: implemented
    decision: >-
      In the dated query analysis_year becomes an override rather than a required input.
      The requested step now settles it as COALESCE(analysis_year, YEAR(address_date)), so a
      cohort supplies id, postcode and address_date and the SIMD edition follows the year that
      date falls in. A non-null analysis_year still wins, unchanged, and the year the query
      reports is the one it used. missing_year therefore now means neither was given, while a
      null address date is still reported on its own as missing_address_date. This supersedes
      the part of sql-as-of-address-date that required both inputs; the life-selection rules
      are untouched.
    reason: >-
      For the usual source the two are one date: an SMR01 episode's admission date is both the
      address date and the year of the event, so requiring the year twice invited a mismatch
      without offering anything. Deriving makes the common case right by construction and each
      row gets the edition current when it happened. Keeping the override preserves the case
      that motivated separating them, PHS v3.5 section 3.2.1.2, where one classification is
      held across a long comparison, and the case where the address was recorded at a different
      time from the health event. It is the same pattern the latest-life queries already use
      for their single EDIT EDITION line: the default is the ordinary reading and the
      alternative is explicit.
    evidence: >-
      Both the generated query and the hand-written walkthrough were changed together and the
      equivalence test now carries five rows with a null year among its fifteen cases. On the
      built SPD table the derived rows report 2015, 2019, 1975, 2005 and 2008 and select SIMD
      2016, 2020v2, none, 2006 and 2009v2, the third showing that deriving a year before 1996
      leaves no edition, which is where the override earns its place: FK17 8DS on 1 June 1975
      with analysis_year 2020 still reads the 1973 life, S01013116, on SIMD 2020v2. The
      walkthrough's demo carries one row of each kind. tests/test_sql_sets.py covers the
      default, the override, and both inputs missing at once.

  - id: walkthrough-both-bandings-and-rurality
    date: 2026-09-18
    status: implemented
    decision: >-
      The walkthrough returns the Scottish Government unweighted quintile and decile beside the
      PHS population-weighted ones, and the 6-fold and 8-fold urban-rural codes with a label for
      the 6-fold. The unweighted bands come from the record that supplied the data zone; the
      rurality comes from the matched record itself, which is what the generated query does, so
      a large user reports its own point location rather than that of the small-user postcode it
      links to. Its demo input became three rows, and the equivalence test now compares these
      four columns too.
    superseded_in_part: >-
      rurality-by-version and rurality-version-by-reference-year, 21 September 2026. The limitation
      this entry gives as its reason, that the directory carries only the 2022 classification so a
      historical address is described by today's categories, no longer holds for the history table:
      the walkthrough now also returns the version for the year. The two bandings and the published
      2022 columns stand as decided here.
    reason: >-
      A reader validating the logic has to see that the same rank produces two different bands:
      PHS splits so each band holds a fifth or a tenth of the population, the Scottish Government
      splits the data zones themselves, and a report that mixes them is wrong in a way nothing
      else catches. Rurality is routinely crossed with deprivation, and holding it next to the
      band makes its one limitation visible: the directory carries a single 2022 classification,
      so a historical address is described by today's categories even though its data zone and
      SIMD are read at the right vintage.
    evidence: >-
      Of 162,049 current postcodes with a 2020v2 band, 5,615 fall in a different quintile and
      12,216 in a different decile under the two bandings. The demo's second row, AB21 0SB on
      1 June 2015, is quintile 3 weighted by population and 4 by data zone, decile 6 against 7.
      The 6-fold labels are the Scottish Government classification and nest exactly as the two
      columns do in the data: code 4 covers 8-fold 4 and 5, code 5 covers 6, code 6 covers 7
      and 8. The NRS dictionary documents only the ranges, 1 to 6 and 1 to 8.

  - id: split-suffix-derived-from-key
    date: 2026-09-20
    status: implemented
    decision: >-
      The NRS split suffix is derived once, as the key minus its base, and every ranking and
      status reads that: part_of() in core/spd.py for pandas, _part() and _tier() in the SQL
      generator, and a part column in the walkthrough. The order among candidates is the whole
      record ranked as A, so whole and A tie and the newest wins between them, then B, then C,
      then any later suffix in letter order. Only a whole record or an A part supplies values;
      a B or C part is still refused with split_a_missing. Two deliberate changes follow. The
      walkthrough now withholds geography for an ambiguous postcode and for a B or C part, as
      the generated queries always did, so its status and its empty values agree. And when
      only B and C are live, B is the reported part rather than the pair being called
      ambiguous, in both the SQL and the build comparison.
    reason: >-
      The A-part rule was tested with the last character of pc_norm in six places. That only
      worked because a whole-record test always ran in front of it: whole postcodes end in A,
      B and C too, so the test was one reordering away from misreading them as parts. The
      B-then-C order decides only which part is reported as matched, never which value is
      used, because neither part may supply one.
    evidence: >-
      G71 8BQB is a whole postcode ending in B and resolves as one. NRS introduces and retires
      the parts together: no date in the SPD 2026/2 directory has a B or C part valid without
      its A, so nothing on the real table resolves differently, and the rebuilt tables keep
      their fingerprints. Two agreement cases in tests/test_agreement.py pin the whole
      postcode ending in B and the B-and-C-only case. Commit 413c024. Column counts quoted in
      sql-two-products and sql-as-of-address-date, 91, 107 and 110, predate shared-exports,
      which removed the coordinate columns: the queries now return 89, 103 and 106.

  - id: rurality-by-version
    date: 2026-09-21
    status: implemented
    decision: >-
      The history table carries the Scottish Government Urban Rural Classification of all nine
      published versions, 2003-2004 to 2022, for every postcode life: per version a 6-fold and
      an 8-fold code and a status, 27 nullable columns appended to the 162 of
      postcode_simd_wide_v1, which are unchanged and in the same order. The schema becomes
      postcode_simd_wide_v2. Each life's own grid reference is placed in that version's pinned
      polygons (core/rurality.py). A point in no polygon is null with status outside_polygons,
      with no nearest-polygon fallback. A point on an edge between two classes is null with
      ambiguous_polygons. A post-office box, a large user linked NO LINKP, is null in every
      version with status po_box, because NRS puts its grid reference at the sorting or
      delivery office. The two 2022 columns NRS publishes are kept exactly as supplied; the
      derived 2022 columns sit beside them. The main table is unchanged: SSPL allocates from
      output-area centroids and keeps one life per postcode, so it has no per-life point.
    reason: >-
      The directory carries one classification, the 2022 one, so a historical address was
      described by today's categories while its data zone and SIMD were read at the right
      vintage. About one life in nine has a different 6-fold class in a version before 2020
      than the 2022 code it carries. Every version's polygons are still published, so one
      postcode file and one method give every version without archived lookups. The status is
      stored per row because a null can mean three different things and a count in the build
      report cannot say which rows. Keeping the published columns beside the derived ones
      leaves the validation permanently visible rather than overwriting a publisher's value.
    evidence: >-
      Gate fixed before the run at 99.5% for current small users and 99% for other cohorts
      over 1,000 lives: point-in-polygon on the 2022 polygons reproduces NRS's published 2022
      codes on 247,770 of 247,773 lives, 100% of current lives, and all three misses are
      deleted lives outside every polygon, none a different class. In the built table the
      derived 2022 codes equal the published ones on all 216,045 placed rows; 31,725 boxes are
      withheld; outside_polygons is 3 to 34 per version except 767 non-box lives in 2005-2006,
      whose coastline is drawn tighter. The original 162 columns keep fingerprint
      59369357e44e45a5, now pinned as wide_v1_columns_fingerprint; the main table keeps
      9515021d99099b43. Readback places every point again from the saved grid references, and
      a test changes a 2005-2006 code, a 2013-2014 code and a 2022 status after writing and
      requires each to be caught. Plan and feasibility result:
      docs/plans/Rurality_By_Version_Plan.md.

  - id: nullable-integers-and-never-blank-text
    date: 2026-09-21
    status: implemented
    decision: >-
      The writers now carry two kinds of column the tables never had. A nullable integer is
      written to Parquet as a null, rendered in the CSV as an empty cell and in the digest as
      the null marker, and restored on import with NULLIF, never as zero. A nullable text
      column that is never blank is named under empty_is_null in the export contract, and the
      import restores its empty cells as nulls; every other text column keeps its existing
      rule, blank or structural null by record type.
    reason: >-
      The rurality codes are the first nullable integers and their statuses the first text
      that is either a value or null. Without the rules an empty code would load as 0, a class
      that does not exist, and an empty status would load as a blank, which the digest would
      then report as corruption of a faithful load.
    evidence: >-
      Verified on SQL Server 2022 (16.0, RTM-CU24-GDR) in the local container with the shipped
      import and check scripts: 230,103 and 247,773 rows, all ten checks pass, history digest
      -3244194952865985434297 over 185 exported columns equal to the manifest's. The main
      table's digest, 600732040592218046898, is unchanged. tests/test_exports.py requires the
      NULLIF guard on every nullable integer and the rule on every empty_is_null column.

  - id: rurality-version-by-reference-year
    date: 2026-09-21
    status: implemented
    decision: >-
      The three SPD queries and the walkthrough return the Urban Rural Classification version
      that suits the year, as rurality_version, rurality_policy, rurality_6fold, rurality_8fold
      and rurality_status, placed after the shared 41-column core. The version is chosen by
      reference year, the year it describes, and applies until the year before the next
      version: 2003-2004, 2005-2006, 2007-2008, 2009-2010, 2011-2012, 2013 to 2015, 2016 to
      2019, 2020 to 2021, 2022 onwards. The year is the one that chose the SIMD edition, so an
      overriding analysis_year fixes both. link_latest.sql uses the latest version throughout.
      The codes are the matched record's own. rurality_status reports a postcode status where
      no single record stands for the postcode, then missing_year, before_first_version or
      invalid_year, then the reason stored with the record. The windows are generated from the
      registry's reference years. The SSPL set is unchanged.
    reason: >-
      PHS publishes no equivalent of Table 4 for rurality, so this is a project choice and is
      labelled as one in the queries and their output. Reference year rather than publication
      date because the purpose is to describe where a person lived, not what was knowable when:
      by publication date, events from 2022 to most of 2024 would take the 2020 version, since
      the 2022 version appeared on 16 December 2024. A separate status is needed because the
      SIMD status cannot express these outcomes: 1996 has a SIMD edition and no rurality
      version.
    evidence: >-
      gov.scot: Urban Rural Classification 2022 published 16 December 2024, built on the
      Census 2022 settlements. Output columns: SSPL 89 unchanged, SPD era and latest 108, SPD
      as-of 111. tests/test_sql_sets.py states the versions and the year windows independently
      of the generator and checks fourteen years, the statuses, a large user reporting its own
      class while its SIMD comes from its link, and that the SSPL set has no rurality column.
      The walkthrough agrees with the generated query on the four rurality columns across
      fifteen cases on the built table.

  - id: previous-life-fallback
    date: 2026-09-23
    status: implemented
    decision: >-
      When no postcode life contains the address date but the postcode had a life that ended
      before it, the dated SQL query, the walkthrough and the Python dated lookups use that
      life: the one whose deletion date is the latest on or before the address date, excluding
      same-day records, and never a later life. The row reports postcode_status previous_life,
      or in Python status previous_life, which carries SIMD and rurality like matched. Every
      rule that applies to a record still applies: a retired PO box gets nothing, and a retired
      large user's linked small-user record must be valid on the last day of the life used.
      The context columns first_introduced_on, previous_life_deleted_on and
      next_life_introduced_on are unchanged, so the gap and any reissue stay visible.
      between_lives and postcode_deleted_by_date remain for the case where only same-day
      records ended before the date. No gap tolerance is applied.
    reason: >-
      A record carrying a postcode after its retirement is most often a Royal Mail recoding
      the record never caught up with: the building did not move, so the retired postcode's
      last location is where the person lived. The latest-life queries already gave retired
      postcodes their last life's SIMD, so the dated query was stricter than its siblings by
      accident rather than by design. Reporting a status of its own keeps the choice
      reviewable and lets an analyst exclude it with one filter. A later life is excluded
      because a reissue can be anywhere.
    evidence: >-
      On the built table: G3 8NR, retired July 2015 and reissued in a different data zone in
      January 2018, asked for June 2016 returns its 1978 life in S01010278, quintile 1, not the
      reissue's S01010283, quintile 4. FK17 8DS in its 1978 gap returns its 1973 life, and TD9
      7PQ, retired in 1999, returns its only life for 2020. tests/test_sql_sets.py and
      tests/test_lookup.py cover the gap, the date after the last life, three lives with two
      gaps, a same-day record, a retired PO box, and a retired large user whose link ended
      the same day or earlier; the walkthrough agrees with the generated query. This changes
      what the dated SQL and the Python dated lookups return for those rows, and is part of
      the 3.0.0 release.

  - id: python-lookups-choose-then-exclude
    date: 2026-09-23
    status: implemented
    decision: >-
      The Python lookups choose the record first, on the whole table, and apply the PO-box and
      large-user exclusions to the record chosen. A date that an excluded record covers is
      not_found; it is never answered by an older life. The shared resolver takes several
      value columns and resolves them as one tuple from one record, a null counting as a
      value, so a rurality class and its stored reason can never come from different split
      parts. attach_by_era and attach_rurality reassemble the cohort by position, not index
      label, and accept an empty cohort. A row with no date gets missing_date in attach,
      attach_by_era and attach_rurality, rather than deleted, no_edition or
      before_first_version.
    reason: >-
      Review of 9fa39d4 found four faults, all in Python and none in SQL. Excluding PO boxes
      before choosing the life let the previous-life fallback answer AB10 1WS in 2025 from a
      1996 life although a PO-box life covers that date; the SQL chooses the life first and
      returns no value. Resolving a class and its reason separately, with nulls ignored in the
      agreement check, gave HS6 5HT class 6 beside outside_polygons and PA66 6BN not_found
      although both of its parts exist. Label-based reassembly duplicated rows sharing an index
      label and failed on an empty cohort. A missing date read as a date before the first
      edition or version. The last two were already in attach_by_era on main.
    evidence: >-
      On the built table: AB10 1WS on 2025-01-01 is not_found, and unique with its own value
      only when PO boxes are asked for; HS6 5HT in 2005-2006 is split_conflict under the
      report rule and the A part, class 6, by default, as in SQL; PA66 6BN is
      outside_polygons under both rules. tests/test_lookup.py pins each fault on a small
      table and the reviewer's postcodes on the built one. No SQL, schema or built data
      changed.
