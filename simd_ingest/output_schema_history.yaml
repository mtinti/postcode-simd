# Frozen output schema of the history table (Scottish Postcode Directory, every postcode life).
# Order, Arrow type and nullability are the contract. postcode_simd_wide_v2 appends the 27 rurality
# columns to the 162 of postcode_simd_wide_v1, which are unchanged and in the same order.
# 65 directory columns + 7 derived + 6 PHS geography + 6 editions x 14 SIMD fields
# + 9 classification versions x (6-fold, 8-fold, status) = 189. postcode_simd_wide_v3 appends the 41
# Scottish Government domain ranks, the 189 unchanged and in the same order: 6 domains for 2004,
# which had no crime domain, and 7 for each later edition = 230. postcode_simd_wide_v4 appends the
# Scottish Government's published domain bands, the 230 unchanged and in the same order: quintile,
# decile and vigintile of each of the 41 domain ranks, then the 2020v2 housing source status = 354.
# postcode_simd_wide_v5 appends the computed population-weighted Scotland quintile and decile of each
# domain rank, 82, then each edition's data-zone population, 6, the 354 unchanged = 442.
