    text: 'A code that identifies a 1991 Census Output Area. Comprised of for example: Local Government
      Region code (1st 2 chars) 56 Local Government District code (2nd 2 chars) 01 NRS Code for the PC
      Sector (2nd 4 chars) 01AB 1981 Enumeration Code (2nd 6 chars) 01AB03 1991 Output Area Code (all
