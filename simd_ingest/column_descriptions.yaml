GridLinkPositionalAccuracy:
  reviewed: false
  spd_large_user:
    range: 1 to 8
    source:
      file: SPD/spd_postcodeindex_cut_26_2_csv/spd-indexdatadictionary-2026-2.docx
      sha256: b543a10df0155caf3bc642c30371ccf848657ef52fb25922afcc0f938fc4214a
    text: Indicates the positional accuracy of the GridLink grid reference allocated to each postcode.
      Description of status values Automatically calculated to be within the building of the matched address
      closest to the postcode. As for status value 1, except by visual inspection of OS MasterMap® Topography
      Layer maps. Approximate to within 50 m of true position. Postcode unit mean – (mean of matched addresses
      with the same postcode, but not snapped to a building). Postcode imputed by ONS by reference to
      surrounding known postcodes. Postcode sector mean – mainly PO boxes. Postcode terminated. The accuracy
      of the data is as indicated by its status value immediately prior to its termination. No coordinates
      available. Note that grid references for PO Box postcodes are assigned to the local Royal Mail sorting/delivery
      office and are deemed low quality. While the Gridlink® RPC is showing as 1 (which is high quality),
      this is purely because the address is being matched to the local Royal Mail sorting/delivery office.
    type: Char(1)
  spd_small_user:
    range: 1 to 8
    source:
      file: SPD/spd_postcodeindex_cut_26_2_csv/spd-indexdatadictionary-2026-2.docx
      sha256: b543a10df0155caf3bc642c30371ccf848657ef52fb25922afcc0f938fc4214a
    text: Indicates the positional accuracy of the GridLink grid reference allocated to each postcode.
      Description of status values Automatically calculated to be within the building of the matched address
      closest to the postcode. As for status value 1, except by visual inspection of OS MasterMap® Topography
      Layer maps. Approximate to within 50 m of true position. Postcode unit mean – (mean of matched addresses
      with the same postcode, but not snapped to a building). Postcode imputed by ONS by reference to
      surrounding known postcodes. Postcode sector mean – mainly PO boxes. Postcode terminated. The accuracy
      of the data is as indicated by its status value immediately prior to its termination. No coordinates
      available. Note that grid references for PO Box postcodes are assigned to the local Royal Mail sorting/delivery
      office and are deemed low quality. While the Gridlink® RPC is showing as 1 (which is high quality),
