# By hand only: a download-mode build on a clean runner, to show the release reproduces.
# It contacts the three publishers, so it is never triggered automatically.
name: build-table
on:
  workflow_dispatch:
    inputs:
      publish_parquet:
        description: "Also upload the Parquet table as an artefact (only if redistribution terms allow)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm build
      - run: docker compose run --rm test
      - name: Report
        run: |
          python3 - <<'EOF'
          import json
          m = json.load(open("results/manifest.json"))
          for name, o in m["tables"].items():
              print(f"{name}: {o['table']} rows {o['rows']:,} columns {o['columns']} index {o['index_source']} {o['index_release']}")
              print(f"  rows-only fingerprint {o['logical_fingerprint']}")
              print(f"  file sha256 {o['sha256']}")
          print(f"decisions {m['decisions_sha256']}  checks {m['summary']}")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-record
          path: |
            results/manifest.json
            results/BUILD_REPORT.md
            results/runs/
      - if: ${{ inputs.publish_parquet }}
        uses: actions/upload-artifact@v4
        with:
          name: postcode-simd-parquet
          path: |
            results/postcode_simd.parquet
            results/postcode_simd_history.parquet
