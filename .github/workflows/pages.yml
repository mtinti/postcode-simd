# The column provenance site (docs/plans/Column_Provenance_Site_Plan.md). Generated from the
# committed schemas, registry, decisions and lineage map: metadata only, no data, no sources.
# Every push and pull request runs the provenance tests, then builds it (strict: a broken link
# fails); only main, or a manual run, deploys it to GitHub Pages, and only after both pass.
name: pages
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,docs]"
      # The provenance tests gate the site: every column traced, every reference real, the
      # exceptional cases right. A site that fails them is never built, let alone deployed.
      - run: python -m pytest tests/test_provenance.py -q -rs
      - run: python -m simd_ingest.provenance_site
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/provenance_site

  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
