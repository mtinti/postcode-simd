# The column provenance site (docs/plans/Column_Provenance_Site_Plan.md), published like nbdev's docs:
# built here and pushed to the gh-pages branch, which GitHub Pages serves. Generated from the committed
# schemas, registry, decisions and lineage map: metadata only, no data, no sources.
#
#   main                 -> https://mtinti.github.io/postcode-simd/
#   any other branch     -> https://mtinti.github.io/postcode-simd/preview/<name>-<hash of the branch>/
#   a deleted branch     -> its preview folder is removed
#   a pull request       -> built and tested only (it may come from a fork, which cannot push)
#
# The provenance tests run first: a site that fails them is never built, let alone published.
# .github/scripts/pages_publish.sh updates gh-pages (retrying from its latest state if another run
# pushed first), then requests a Pages build and fails unless one containing the update completes.
name: pages
on:
  push:
  pull_request:
  workflow_dispatch:
  delete:

permissions:
  contents: write
  pages: write

jobs:
  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,docs]"
      - run: python -m pytest tests/test_provenance.py -q -rs
      - name: Where this build is published
        run: |
          dest=$(.github/scripts/pages_publish.sh dest "$GITHUB_REF_NAME")
          echo "SITE_URL=https://mtinti.github.io/postcode-simd/${dest:+$dest/}" >> "$GITHUB_ENV"
          echo "publishing to: ${dest:-the site root}"
      - run: python -m simd_ingest.provenance_site
      - run: mkdocs build
      - name: Publish to gh-pages and wait for Pages
        if: github.event_name != 'pull_request'
        run: .github/scripts/pages_publish.sh publish "$GITHUB_REF_NAME" build/provenance_site

  remove-preview:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Remove the deleted branch's preview
        run: .github/scripts/pages_publish.sh remove "${{ github.event.ref }}"
